<!DOCTYPE html>
<html>
<head>
    <title>My Sample Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #34495e;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .card {
            display: inline-block;
            width: 220px;
            margin: 15px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 8px lightgray;
        }

        .card h3 {
            color: #2c3e50;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #2980b9;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Sample Website</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2>Welcome!</h2>
    <p>This is a simple HTML and CSS webpage.</p>

    <div class="card">
        <h3>HTML</h3>
        <p>Build the structure of a webpage.</p>
    </div>

    <div class="card">
        <h3>CSS</h3>
        <p>Add colors and styles to your webpage.</p>
    </div>

    <div class="card">
        <h3>JavaScript</h3>
        <p>Make your webpage interactive.</p>
    </div>

    <br><br>

    <button onclick="contactMessage()">Contact Us</button>

    <p id="msg"></p>
</div>

<footer>
    <p>© 2026 My Sample Website</p>
</footer>

<script>
    function contactMessage() {
        document.getElementById("msg").innerHTML =
            "Thank you! We will contact you soon.";
    }
</script>

</body>
</html>
